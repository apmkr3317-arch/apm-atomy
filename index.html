<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APM ATOMY｜商品資訊中心</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f5;color:#292929;font-family:Arial,"Noto Sans TC",sans-serif}
header{background:#202b27;color:white;padding:35px 20px;text-align:center}
header h1{letter-spacing:4px;margin:0;font-size:28px}
header p{color:#d6dfd9;font-size:13px;letter-spacing:2px}
main{max-width:1000px;margin:30px auto;padding:0 16px}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:white}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.categories button{border:1px solid #ccc;background:white;padding:9px 16px;border-radius:20px;cursor:pointer}
.categories button.active{background:#263a31;color:white;border-color:#263a31}
.status{color:#777;font-size:14px;margin:18px 0}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:12px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:210px;object-fit:contain;background:#fafafa}
.info{padding:15px}
.code{color:#888;font-size:12px}
.info h3{font-size:17px;margin:8px 0}
.spec{font-size:13px;color:#777;line-height:1.6}
.price{font-size:19px;font-weight:bold;color:#8b6542;margin-top:12px}
.empty{text-align:center;color:#888;padding:50px 10px;grid-column:1/-1}
footer{text-align:center;padding:35px;color:#999;font-size:12px}
</style>
</head>
<body>
<header>
<h1>APM ATOMY</h1>
<p>PRODUCT INFORMATION CENTER</p>
</header>
<main>
  <div id="admin-login">
  <h3>管理員登入</h3>
  <input id="admin-email" type="email" placeholder="管理員 Email">
  <input id="admin-password" type="password" placeholder="管理員密碼">
  <button onclick="adminLogin()">登入</button>
  <p id="admin-message"></p>
</div>

<div id="admin-panel" style="display:none;">
 <input id="product-code" placeholder="商品編號">
<input id="product-name" placeholder="商品名稱">

<select id="product-category">
  <option value="韓國特惠">韓國特惠</option>
  <option value="日本特惠">日本特惠</option>
  <option value="韓國保健食品">韓國保健食品</option>
  <option value="韓國保養品">韓國保養品</option>
  <option value="韓國食品">韓國食品</option>
  <option value="韓國生活用品">韓國生活用品</option>
  <option value="日本保健食品">日本保健食品</option>
  <option value="紐西蘭保健食品">紐西蘭保健食品</option>
  <option value="馬來西亞保健食品">馬來西亞保健食品</option>
</select>

<input id="product-price" type="number" placeholder="商品價格">
<input id="product-spec" placeholder="商品規格">
<input id="product-image" type="file" accept="image/*">
<img id="image-preview" style="display:none;width:150px;margin-top:10px;">

<textarea id="product-description" placeholder="商品介紹"></textarea>

<button onclick="saveProduct()">儲存商品</button>
<button onclick="clearProductForm()">清空表單</button>

<p id="product-message"></p>
  <p>管理員已登入</p>
  <button onclick="adminLogout()">登出</button>
</div>
<input id="search" class="search" placeholder="搜尋商品名稱或商品編號...">
<div id="categories" class="categories"></div>
<div id="status" class="status">正在載入商品資料...</div>
<div id="products" class="products"></div>
</main>
<footer>APM ATOMY｜商品資訊中心</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
<script>
const SUPABASE_URL = "https://zqmeuxexdyedkavddwcq.supabase.co";
const SUPABASE_KEY = "sb_publishable_jiyJMcqNiFY_6-WynwYgDg_jQAnnnn2";

 const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ADMIN_UID = "fca371d8-931f-48af-8478-bea4a4cc14c7";

let allProducts = [];
let selectedCategory = "全部";
let isAdmin = false;
  
  async function adminLogin(){
  const email = document.getElementById("admin-email").value.trim();
  const password = document.getElementById("admin-password").value;
  const message = document.getElementById("admin-message");

  message.textContent = "正在登入...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    message.textContent = "登入失敗，請確認帳號及密碼。";
    return;
  }

  if(data.user.id !== ADMIN_UID){
    await supabaseClient.auth.signOut();
    message.textContent = "此帳號沒有管理員權限。";
    return;
  }

  isAdmin = true;
  document.getElementById("admin-login").style.display = "none";
  document.getElementById("admin-panel").style.display = "block";
  message.textContent = "";
  renderProducts(); 
}

async function adminLogout(){
  await supabaseClient.auth.signOut();
  isAdmin = false;
  document.getElementById("admin-login").style.display = "block";
  document.getElementById("admin-panel").style.display = "none";
  document.getElementById("admin-password").value = "";
}
let editingProductId = null;

  document.getElementById("product-image").addEventListener("change", function(){
  const file = this.files[0];
  const preview = document.getElementById("image-preview");

  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }else{
    preview.src = "";
    preview.style.display = "none";
  }
});

async function saveProduct(){
  const message = document.getElementById("product-message");

  const product = {
    product_code: document.getElementById("product-code").value.trim(),
    name: document.getElementById("product-name").value.trim(),
    category: document.getElementById("product-category").value,
    price: Number(document.getElementById("product-price").value) || null,
    spec: document.getElementById("product-spec").value.trim(),
    image_url: "",
    description: document.getElementById("product-description").value.trim(),
    is_active: true
  };

  if(!product.product_code || !product.name){
    message.textContent = "請填寫商品編號及商品名稱。";
    return;
  }

  message.textContent = "正在儲存...";

    const imageFile = document.getElementById("product-image").files[0];

    if(imageFile && !imageFile.type.startsWith("image/")){
    message.textContent = "請選擇圖片檔案。";
    return;
  }

  if(imageFile && imageFile.size > 5 * 1024 * 1024){
    message.textContent = "圖片大小不能超過 5MB。";
    return;
  }
  
if(editingProductId){
    const oldProduct = allProducts.find(p => p.id === editingProductId);
    product.image_url = oldProduct ? oldProduct.image_url || "" : "";
  }
  
  if(imageFile){
    const fileExt = imageFile.name.split(".").pop();
    const fileName = product.product_code + "_" + Date.now() + "." + fileExt;

    message.textContent = "正在上傳商品圖片...";

    const { data: uploadData, error: uploadError } =
      await supabaseClient.storage
        .from("product-images")
        .upload(fileName, imageFile);

    if(uploadError){
      message.textContent = "圖片上傳失敗：" + uploadError.message;
      return;
    }

    const { data: urlData } = supabaseClient.storage
      .from("product-images")
      .getPublicUrl(fileName);

    product.image_url = urlData.publicUrl;
  }

  let result;

  if(editingProductId){
    result = await supabaseClient
      .from("products")
      .update(product)
      .eq("id", editingProductId);
  }else{
    result = await supabaseClient
      .from("products")
      .insert([product]);
  }

  if(result.error){
    message.textContent = "儲存失敗：" + result.error.message;
    return;
  }

  message.textContent = "商品儲存成功！";
  clearProductForm();
  await loadProducts();
}
function clearProductForm(){
  editingProductId = null;

  document.getElementById("product-code").value = "";
  document.getElementById("product-name").value = "";
  document.getElementById("product-category").value = "韓國特惠";
  document.getElementById("product-price").value = "";
  document.getElementById("product-spec").value = "";
  document.getElementById("product-image").value = "";
  document.getElementById("image-preview").src = "";
  document.getElementById("image-preview").style.display = "none";
  document.getElementById("product-description").value = "";
  document.getElementById("product-message").textContent = "";
}
  
async function loadProducts(){
  const status = document.getElementById("status");
  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=*&is_active=eq.true&order=sort_order.asc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("資料讀取失敗：" + response.status);
    }

    allProducts = await response.json();
    renderCategories();
    renderProducts();
  } catch(error) {
    status.textContent = "商品資料載入失敗，請確認資料庫設定。";
    console.error(error);
  }
}

function editProduct(id){
  const product = allProducts.find(p => p.id === id);

  if(!product) return;

  editingProductId = product.id;

  document.getElementById("product-code").value = product.product_code || "";
  document.getElementById("product-name").value = product.name || "";
  document.getElementById("product-category").value = product.category || "韓國特惠";
  document.getElementById("product-price").value = product.price ?? "";
  document.getElementById("product-spec").value = product.spec || "";
  document.getElementById("image-preview").src = product.image_url || "";
  document.getElementById("image-preview").style.display =
  product.image_url ? "block" : "none";
  document.getElementById("product-description").value = product.description || "";

  document.getElementById("product-message").textContent = "正在修改：" + product.name;

  document.getElementById("admin-panel").scrollIntoView({
    behavior: "smooth"
  });
}

async function deleteProduct(id){
  const product = allProducts.find(p => p.id === id);

  if(!product) return;

  const confirmed = confirm(
    "確定要刪除商品「" + product.name + "」嗎？"
  );

  if(!confirmed) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if(error){
    alert("刪除失敗：" + error.message);
    return;
  }

  alert("商品已刪除！");
  await loadProducts();
}
  
async function moveProduct(id, direction){
  const sortableProducts = selectedCategory === "全部"
    ? allProducts
    : allProducts.filter(p => p.category === selectedCategory);

  const index = sortableProducts.findIndex(p => p.id === id);
  const targetIndex = index + direction;

  if(index < 0 || targetIndex < 0 || targetIndex >= sortableProducts.length){
    return;
  }

  const current = sortableProducts[index];
  const target = sortableProducts[targetIndex];

  const results = await Promise.all([
    supabaseClient
      .from("products")
      .update({sort_order: target.sort_order})
      .eq("id", current.id),

    supabaseClient
      .from("products")
      .update({sort_order: current.sort_order})
      .eq("id", target.id)
  ]);

  const failed = results.find(result => result.error);

  if(failed){
    alert("排序儲存失敗：" + failed.error.message);
    await loadProducts();
    return;
  }

  await loadProducts();
}

function renderCategories(){
  const allCategories = [
    "韓國特惠",
    "日本特惠",
    "韓國保健食品",
    "韓國保養品",
    "韓國食品",
    "韓國生活用品",
    "AZA商品"
    "日本保健食品",
    "紐西蘭保健食品",
    "馬來西亞保健食品"
  ];

  const categories = allCategories.filter(category =>
    allProducts.some(p => p.category === category)
  );

  document.getElementById("categories").innerHTML =
    categories.map(c=>`
      <button class="${c===selectedCategory?'active':''}"
      onclick='selectCategory(${JSON.stringify(c)})'>${escapeHTML(c)}</button>
    `).join("");
}
function selectCategory(category){
  if(selectedCategory === category){
    selectedCategory = "全部";
  }else{
    selectedCategory = category;
  }

  renderCategories();
  renderProducts();
}
function renderProducts(){
  const keyword = document.getElementById("search").value.trim().toLowerCase();

  const filtered = allProducts.filter(p=>{
    const matchesCategory = selectedCategory==="全部" || p.category===selectedCategory;
    const matchesKeyword =
      (p.name||"").toLowerCase().includes(keyword) ||
      (p.product_code||"").toLowerCase().includes(keyword);
    return matchesCategory && matchesKeyword;
  });

  document.getElementById("status").textContent =
    "共找到 " + filtered.length + " 項商品";

  document.getElementById("products").innerHTML =
    filtered.length ? filtered.map(p=>`
      <article class="card">
        ${p.image_url
          ? `<img src="${escapeHTML(p.image_url)}" alt="${escapeHTML(p.name)}" loading="lazy">`
          : `<div style="height:210px;display:grid;place-items:center;color:#aaa;background:#fafafa">商品圖片</div>`
        }
        <div class="info">
          <div class="code">${escapeHTML(p.product_code||"")}</div>
          <h3>${escapeHTML(p.name)}</h3>
          <div class="spec">${escapeHTML(p.spec||"")}</div>
          <div class="spec">${escapeHTML(p.description||"")}</div>
          ${p.price!==null && p.price!==undefined
            ? `<div class="price">NT$ ${Number(p.price).toLocaleString("zh-TW")}</div>`
            : ""}
            ${isAdmin ? `
 <button onclick="moveProduct('${p.id}', -1)">↑</button>
<button onclick="moveProduct('${p.id}', 1)">↓</button>
<button onclick="editProduct('${p.id}')">修改商品</button>
<button onclick="deleteProduct('${p.id}')">刪除商品</button>
` : ""}
        </div>
      </article>
    `).join("")
    : `<div class="empty">目前沒有找到符合的商品</div>`;
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}

document.getElementById("search").addEventListener("input",renderProducts);
loadProducts();
</script>
</body>
</html>
